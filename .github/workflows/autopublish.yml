name: Daily Auto-Publish

on:
  schedule:
    - cron: '0 5 * * *'  # 6AM Algeria time (UTC+1)
  workflow_dispatch:  # Manual trigger for testing

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5

      - name: Run publish script
        env:
          INDEXNOW_KEY: '576c8a15fb864a5db799a6407203923a'
        run: python scripts/autopublish.py

      - name: Commit and push if articles published
        run: |
          git config --global user.email "ethan@ecoliving-journey.com"
          git config --global user.name "Eco Living Journey Autopublish"
          git add .
          if git diff --staged --quiet; then
            echo "No articles to publish today."
          else
            git commit -m "Auto-publish $(date +'%b %d %Y') scheduled articles"
            git pull --rebase origin main
            git push origin main
          fi
